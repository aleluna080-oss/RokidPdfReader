name: Build Rokid PDF Reader APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download MediaPipe gesture model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task" \
            --output app/src/main/assets/gesture_recognizer.task
          test -s app/src/main/assets/gesture_recognizer.task

      - name: Build debug APK
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RokidPdfReader-V3-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RokidPdfReader-V3-APK
          path: RokidPdfReader-V3-debug.apk
          if-no-files-found: error
          retention-days: 30
